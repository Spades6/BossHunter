name: Deploy hackathon judge demo

on:
  push:
    branches:
      - main
      - codex/hackathon-2026-demo
    paths:
      - "src/bosshunter/web/frontend/**"
      - ".github/workflows/hackathon-demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/bosshunter/web/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: src/bosshunter/web/frontend
        run: npm ci
      - name: Build isolated judge demo
        working-directory: src/bosshunter/web/frontend
        env:
          VITE_DEMO_ONLY: "1"
          VITE_BASE_PATH: /BossHunter/
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/bosshunter/web/frontend/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
